# Tuned on rt/utlidar/cloud_base with a standing Go2 (see docs/SENSOR_VALIDATION.md).
# expected_ground_z is base_link height for a STANDING robot (odom z about 0.31 m); it does
# not fit a lying robot. Keep the input levelled, which go2_replay.py and go2_live.py do.
preprocessing:
  min_range: 0.1
  max_range: 30.0
  voxel_size: 0.05
ground:
  distance_threshold: 0.06
  iterations: 200
  max_tilt_deg: 20
  expected_ground_z: -0.32
  height_tolerance: 0.12
  min_inliers: 20
  seed: 7
clustering:
  eps: 0.3
  min_points: 8
